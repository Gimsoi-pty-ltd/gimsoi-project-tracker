---
name: CI Pipeline

"on":
  push:
    branches:
      - main
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-ci:
    name: Lint CI Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check YAML Syntax
        run: |
          pipx install yamllint
          yamllint --strict .github/workflows/

  security:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    needs: lint-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block Prohibited File Types
        run: |
          FORBIDDEN_FILES=$(find . -type f \
            \( -name "*.env" -o -name "*.pem" -o -name "*.key" \) \
            -not -path "*/node_modules/*")
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "::error title=Prohibited Files::Remove these files:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          echo "No prohibited file extensions found."
      - name: Gitleaks Secret Scan
        run: |
          ver="v8.18.4"
          base="https://github.com/gitleaks/gitleaks/releases/download"
          url="$base/${ver}/gitleaks_8.18.4_linux_x64.tar.gz"
          wget -qO- "$url" | tar xvz && sudo mv gitleaks /usr/local/bin/
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --verbose \
            --redact
      - name: Verify Secret Masking
        env:
          TEST_SECRET: ${{ secrets.FIREBASE_API_KEY_TEST }}
        run: |
          if [ -z "$TEST_SECRET" ]; then
             echo "::warn::FIREBASE_API_KEY_TEST missing. Skipping."
          else
             echo "Testing secret masking..."
             echo "The secret value is: $TEST_SECRET"
             echo "If you see '***' above, masking is working."
          fi
      - name: Security Remediation Steps
        if: failure()
        run: |
          echo "::error title=Security Check Failed::STOP! DO NOT IGNORE."
          echo "You have committed a secret or a prohibited file."
          echo "HOW TO FIX THIS:"
          echo "1. Read the guide: docs/security/handling-secrets.md"
          echo "2. If it's a file (.env), remove it: 'git rm .env'"
          echo "3. If it's a secret string, rotate the key immediately."

  duplicate-code-check:
    name: Duplicate Code Check
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install jscpd
        run: npm install -g jscpd
      - name: Run Duplicate Code Scan
        run: >
          jscpd apps/backend apps/frontend
          --threshold 5
          --ignore "**/node_modules/**,**/*.test.*,**/*.spec.*,**/dist/**"
          --reporters html
          --output ./jscpd-report
      - name: Upload Duplicate Code Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-code-report
          path: ./jscpd-report
          retention-days: 7

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    needs: [security, duplicate-code-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: apps/backend
        run: npx prisma generate
      - name: Backend Test
        working-directory: apps/backend
        run: |
          echo "Backend test step ready"
          echo "Test command can be enabled when env vars are finalized"
      - name: Package backend artifacts
        run: |
          mkdir -p artifacts/backend
          cp -r apps/backend artifacts/backend/
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: artifacts/backend

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: [security, duplicate-code-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Frontend Build
        working-directory: apps/frontend
        run: npm run build
      - name: Package frontend artifacts
        run: |
          mkdir -p artifacts/frontend
          cp -r apps/frontend/dist artifacts/frontend/
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package
          path: artifacts/frontend

  # ------------------------------------------------------------------
  # JOB 6: DEPLOY TO ZOHO CATALYST
  # ------------------------------------------------------------------
  deploy-to-catalyst:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Catalyst CLI
        run: npm install -g zcatalyst-cli

      - name: Deploy Backend (AppSail)
        working-directory: ./apps/backend
        run: >
          catalyst deploy appsail
          --project ${{ secrets.CATALYST_PROJECT_ID_PROD }}
          --token ${{ secrets.CATALYST_TOKEN }}

      - name: Deploy Frontend (Web Client)
        run: |
          cd apps/frontend
          npm run build
          cd ../..
          catalyst deploy --only client \
            --project ${{ secrets.CATALYST_PROJECT_ID_PROD }} \
            --token ${{ secrets.CATALYST_TOKEN }}