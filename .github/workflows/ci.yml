---
name: CI Pipeline

"on":
  push:
    branches:
      - main
      - infrastructure/catalyst-setup
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  # Allows manual triggering from the Actions tab

# Ensures tests only have the ability to read but not make changes to tests
permissions:
  contents: read

# Cancels old test build to improve speed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # JOB 1: CHECK CI SYNTAX (Ensures workflow file structure is correct)
  # ------------------------------------------------------------------
  lint-ci:
    name: Lint CI Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check YAML Syntax
        run: |
          pipx install yamllint
          yamllint --strict .github/workflows/

  # ------------------------------------------------------------------
  # JOB 2: SECURITY
  # ------------------------------------------------------------------
  security:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    needs: lint-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Allows Gitleaks to scan from beginning of repo history
          fetch-depth: 0

      # 1. Block dangerous files immediately
      - name: Block Prohibited File Types
        run: |
          FORBIDDEN_FILES=$(find . -type f \
            \( -name "*.env" -o -name "*.pem" -o -name "*.key" \) \
            -not -path "*/node_modules/*")

          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "::error title=Prohibited Files::Remove these files:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          echo "No prohibited file extensions found."

      # 2. SCAN: Detect secrets using Gitleaks (Free Workaround)
      - name: Gitleaks Secret Scan
        run: |
          # Install (One-liner style)
          ver="v8.18.4"
          # Broken into multiple lines to satisfy linter line-length limits
          base="https://github.com/gitleaks/gitleaks/releases/download"
          url="$base/${ver}/gitleaks_8.18.4_linux_x64.tar.gz"
          wget -qO- "$url" | tar xvz && sudo mv gitleaks /usr/local/bin/

          # Scan
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --verbose \
            --redact

      # 3. VERIFY: Ensure CI masks secrets in logs
      - name: Verify Secret Masking
        env:
          TEST_SECRET: ${{ secrets.FIREBASE_API_KEY_TEST }}
        run: |
          if [ -z "$TEST_SECRET" ]; then
             echo "::warn::FIREBASE_API_KEY_TEST missing. Skipping."
          else
             echo "Testing secret masking..."
             echo "The secret value is: $TEST_SECRET"
             echo "If you see '***' above, masking is working."
          fi

      # 4. REMEDIATE: Point to docs if any step above failed
      - name: Security Remediation Steps
        if: failure()
        run: |
          echo "::error title=Security Check Failed::STOP! DO NOT IGNORE."
          echo "========================================================"
          echo "You have committed a secret or a prohibited file."
          echo "HOW TO FIX THIS:"
          echo "1. Read the guide: docs/security/handling-secrets.md"
          echo "2. If it's a file (.env), remove it: 'git rm .env'"
          echo "3. If it's a secret string, rotate the key immediately."
          echo "========================================================"

  # ------------------------------------------------------------------
  # JOB 3: BACKEND
  # ------------------------------------------------------------------
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    needs: security

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/backend
        run: npx prisma generate

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: "playwright-${{ runner.os }}-chromium-\
            ${{ hashFiles('apps/backend/package-lock.json') }}"
          restore-keys: |
            playwright-${{ runner.os }}-chromium-

      - name: Install Playwright browsers
        working-directory: apps/backend
        run: npx playwright install chromium

      - name: Push Prisma schema
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
        run: npx prisma db push

      - name: Backend Test
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          JWT_SECRET: ci-test-jwt-secret-do-not-use-in-production
          GMAIL_USER: ci-test@example.com
          GMAIL_APP_PASSWORD: ci-dummy-password
          GEMINI_API_KEY: dummy
          CLIENT_URL: http://localhost:5173
          PORT: 5001
          NODE_ENV: test
        run: npm run test:api

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/backend/playwright-report/
          retention-days: 14

      - name: Package backend artifacts
        working-directory: apps/backend
        run: |
          # Catalyst deploys node_modules as-is (no build/prune of its own),
          # so only production deps and app code belong in the artifact.
          npm prune --omit=dev
          rm -rf playwright-report test-results

          mkdir -p ../../artifacts/backend
          cp -r . ../../artifacts/backend/

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: artifacts/backend
          retention-days: 14

  # ------------------------------------------------------------------
  # JOB 4: FRONTEND
  # ------------------------------------------------------------------
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Frontend Build
        working-directory: apps/frontend
        run: npm run build

      - name: Package frontend artifacts
        run: |
          mkdir -p artifacts/frontend
          cp -r apps/frontend/dist/. artifacts/frontend/
          # Required by Catalyst's client-hosting plugin; lives in the
          # frontend source, not generated by the Vite build.
          cp apps/frontend/client-package.json artifacts/frontend/

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package
          path: artifacts/frontend
          retention-days: 14
