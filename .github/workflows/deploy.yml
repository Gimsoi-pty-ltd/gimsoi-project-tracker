---
name: Deploy to Zoho Catalyst

"on":
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

  # ci_run_id redeploys a specific already-tested artifact (rollback)
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: >
          CI Pipeline run ID to deploy artifacts from. Leave blank to use
          the most recent successful run on main (used for rollback).
        required: false
        type: string

# actions: read is needed to download artifacts from another workflow run
permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'infrastructure/catalyst-setup'
      )

    environment:
      name: production

    steps:
      # Pick which already-tested CI run's artifacts to deploy (never rebuilds)
      - name: Resolve source CI run ID
        id: resolve-run
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID_INPUT: ${{ inputs.ci_run_id }}
        run: |
          if [ -n "$WORKFLOW_RUN_ID" ]; then
            RUN_ID="$WORKFLOW_RUN_ID"
            RUN_SHA="$WORKFLOW_RUN_SHA"
          elif [ -n "$CI_RUN_ID_INPUT" ]; then
            RUN_ID="$CI_RUN_ID_INPUT"
            RUN_SHA=$(gh run view "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --json headSha --jq '.headSha')
          else
            RUN_JSON=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "CI Pipeline" \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId,headSha)
            RUN_ID=$(echo "$RUN_JSON" | jq -r '.[0].databaseId')
            RUN_SHA=$(echo "$RUN_JSON" | jq -r '.[0].headSha')
          fi

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::Could not resolve a CI Pipeline run to deploy from."
            exit 1
          fi

          if [ -z "$RUN_SHA" ] || [ "$RUN_SHA" = "null" ]; then
            echo "::error::Could not resolve the commit SHA for run $RUN_ID."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying artifacts from CI run $RUN_ID (commit $RUN_SHA)"

      # Check out the exact commit the artifacts were built from
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-run.outputs.run_sha }}

      # Pull the CI-built backend into apps/backend
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-package
          path: apps/backend
          github-token: ${{ github.token }}
          run-id: ${{ steps.resolve-run.outputs.run_id }}

      # Pull the CI-built frontend into apps/frontend/dist
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-package
          path: apps/frontend/dist
          github-token: ${{ github.token }}
          run-id: ${{ steps.resolve-run.outputs.run_id }}

      # Confirm the downloaded artifacts are a finished, runnable app
      - name: Verify downloaded build output
        run: |
          for f in apps/backend/server.js \
                   apps/frontend/dist/index.html \
                   apps/frontend/dist/client-package.json; do
            if [ ! -f "$f" ]; then
              echo "::error::$f missing from downloaded artifact"
              exit 1
            fi
          done

      - name: Install Catalyst CLI
        run: npm install -g zcatalyst-cli

      - name: Configure Catalyst Authentication
        run: |
          mkdir -p ~/.catalyst

          TOKEN='${{ secrets.CATALYST_TOKEN }}'

          echo "{\"token\":\"$TOKEN\"}" \
             > ~/.catalyst/token.json

      # Deploy backend AppSail + frontend hosting per catalyst.json
      - name: Deploy to Catalyst
        env:
          CATALYST_PROJECT_ID: ${{ secrets.CATALYST_PROJECT_ID_PROD }}
          NODE_ENV: production
        run: |
          catalyst deploy --project $CATALYST_PROJECT_ID

      # Verify the deployed app is actually up before calling it done
      - name: Smoke test deployment
        env:
          BACKEND_URL: ${{ secrets.CATALYST_PROD_BACKEND_URL }}
          FRONTEND_URL: ${{ secrets.CATALYST_PROD_FRONTEND_URL }}
        run: bash scripts/smoke-test.sh "$BACKEND_URL" "$FRONTEND_URL"

      - name: Deployment Complete
        run: |
          echo "Deployment completed successfully and passed smoke tests."
